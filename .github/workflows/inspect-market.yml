name: Inspect Analitica Fantasy market
on:
  push:
    paths:
      - ".github/workflows/inspect-market.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find the market pagination action in public app code
        run: |
          python - <<'PY'
          import requests, re
          from urllib.parse import urljoin
          base = "https://www.analiticafantasy.com"
          reader = requests.get("https://r.jina.ai/http://www.analiticafantasy.com/fantasy-la-liga/mercado",
                                headers={"User-Agent":"Mozilla/5.0","X-Return-Format":"html"}, timeout=60)
          html = reader.text
          print("HTML_STATUS", reader.status_code, "BYTES", len(html))
          for term in ("tablaData", "initialPlayers", "setPage", "currentPage", "pageSize"):
              positions = [m.start() for m in re.finditer(re.escape(term), html, re.I)]
              print("\\nHTML_TERM", term, "COUNT", len(positions))
              for pos in positions[:4]:
                  print("HTML_CONTEXT", re.sub(r"\\s+", " ", html[max(0,pos-500):pos+1100])[:1600])
          scripts = re.findall(r'<script[^>]+src="([^"]+)', html, re.I)
          print("\\nSCRIPT_COUNT", len(scripts))
          needles = ("initialPlayers", "tablaData", "setCurrentPage", "setPage", "pageSize",
                     "currentPage", "pagination", "mercado", "fetch(", "axios", "/api/")
          for src in scripts:
              url = urljoin(base, src)
              try:
                  resp = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}, timeout=25)
                  js = resp.text
                  found = [n for n in needles if n.lower() in js.lower()]
                  if not found:
                      continue
                  print("\\nASSET", url, "STATUS", resp.status_code, "BYTES", len(js), "HITS", found)
                  for needle in found:
                      match = re.search(re.escape(needle), js, re.I)
                      if match:
                          pos = match.start()
                          print("JS_CONTEXT", needle, re.sub(r"\\s+", " ", js[max(0,pos-350):pos+900])[:1250])
                  for match in re.findall(r'["\\']([^"\\']{0,180}(?:/api/|mercado|players|jugadores)[^"\\']{0,180})["\\']', js, re.I):
                      print("JS_ROUTE", match[:350])
              except Exception as exc:
                  print("ASSET_ERROR", url, repr(exc))
          PY
