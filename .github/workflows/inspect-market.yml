name: Inspect Analitica Fantasy market
on:
  push:
    paths:
      - ".github/workflows/inspect-market.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check market pagination and player rows
        run: |
          python - <<'PY'
          import requests, re
          base = "https://r.jina.ai/http://www.analiticafantasy.com/fantasy-la-liga/mercado"
          headers = {"User-Agent": "Mozilla/5.0", "Accept": "text/plain", "x-no-cache": "true"}
          for params in ("?page=1&limit=10", "?page=2&limit=10", "?page=3&limit=10", "?pageIndex=0&limit=10", "?pageIndex=1&limit=10", "?pagina=1", "?pagina=2"):
              url = base + params
              try:
                  response = requests.get(url, headers=headers, timeout=45)
                  text = response.text
                  print("\\n===== PARAMS", params, "STATUS", response.status_code, "BYTES", len(text), "=====")
                  lines = [line.strip() for line in text.splitlines() if line.strip()]
                  for line in lines:
                      low = line.lower()
                      if any(x in low for x in ("€", "subida", "bajada", "valor", "pedri", "mbapp", "jugadores", "página")):
                          print(line[:500])
                  print("PLAYER_LIKE_LINES", sum(1 for line in lines if re.search(r"€|\\+\\s*\\d|\\d+\\s*%", line)))
              except Exception as exc:
                  print("ERROR", params, repr(exc))
          PY
