name: Inspect Analitica Fantasy market
on:
  push:
    paths:
      - ".github/workflows/inspect-market.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract and validate all embedded market players
        run: |
          python - <<'PY'
          import requests, re, json
          url = "https://r.jina.ai/http://www.analiticafantasy.com/fantasy-la-liga/mercado"
          r = requests.get(url, headers={"User-Agent":"Mozilla/5.0","X-Return-Format":"html"}, timeout=90)
          print("READER_STATUS", r.status_code, "HTML_BYTES", len(r.text))
          r.raise_for_status()
          start = None
          for match in re.finditer("initialPlayers", r.text):
              candidate = r.text.find("[", match.end())
              if candidate >= 0 and r.text[candidate+1:candidate+2] == "{":
                  start = candidate
                  break
          if start is None:
              raise SystemExit("ERROR: embedded initialPlayers object array not found")
          payload = r.text[start:].replace(chr(92) + '"', '"')
          players, end = json.JSONDecoder().raw_decode(payload)
          from collections import Counter
          player_rows = [p for p in players if p.get("masterPlayerId") is not None and p.get("playerSlug")]
          coaches = [p for p in players if p.get("masterPlayerId") is None]
          ids = [p.get("masterPlayerId") for p in player_rows]
          slugs = [p.get("playerSlug") for p in player_rows]
          print("TOTAL_MARKET_ROWS", len(players))
          print("PLAYER_ROWS", len(player_rows), "COACH_ROWS", len(coaches))
          print("UNIQUE_PLAYER_IDS", len(set(ids)), "UNIQUE_PLAYER_SLUGS", len(set(slugs)))
          print("FIRST_PLAYER", player_rows[0].get("nickname"), player_rows[0].get("masterPlayerId"))
          print("LAST_PLAYER", player_rows[-1].get("nickname"), player_rows[-1].get("masterPlayerId"))
          if len(players) != 596 or len(player_rows) != 564 or len(set(ids)) != 564 or len(set(slugs)) != 564:
              raise SystemExit("ERROR: market player validation failed")
          def pct(p):
              old = p.get("marketValue", 0) - p.get("subida", 0)
              return (p.get("subida", 0) / old * 100) if old > 0 else 0
          top = sorted((p for p in player_rows if (p.get("subida") or 0) > 0),
                       key=lambda p: p["subida"], reverse=True)[:30]
          print("TOP30_COUNT", len(top))
          for i, p in enumerate(top, 1):
              print(f"{i:02d}. {p.get('nickname')} | +{p.get('subida')} EUR | {pct(p):.2f}% | id={p.get('masterPlayerId')}")
          print("VALIDATION_OK")
          PY
