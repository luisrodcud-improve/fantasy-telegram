name: Inspect Analitica Fantasy market
on:
  push:
    paths:
      - ".github/workflows/inspect-market.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract and validate all embedded market players
        run: |
          python - <<'PY'
          import requests, re, json
          url = "https://r.jina.ai/http://www.analiticafantasy.com/fantasy-la-liga/mercado"
          r = requests.get(url, headers={"User-Agent":"Mozilla/5.0","X-Return-Format":"html"}, timeout=90)
          print("READER_STATUS", r.status_code, "HTML_BYTES", len(r.text))
          r.raise_for_status()
          start = None
          for match in re.finditer("initialPlayers", r.text):
              candidate = r.text.find("[", match.end())
              if candidate >= 0 and r.text[candidate+1:candidate+2] == "{":
                  start = candidate
                  break
          if start is None:
              raise SystemExit("ERROR: embedded initialPlayers object array not found")
          payload = r.text[start:].replace(chr(92) + '"', '"')
          players, end = json.JSONDecoder().raw_decode(payload)
          from collections import Counter
          ids = [p.get("masterPlayerId") for p in players]
          slugs = [p.get("playerSlug") for p in players]
          dup_ids = [(k,v) for k,v in Counter(ids).items() if v > 1]
          print("PLAYERS_EXTRACTED", len(players))
          print("UNIQUE_MASTER_IDS", len(set(ids)), "REPEATED_IDS", len(dup_ids))
          print("UNIQUE_PLAYER_SLUGS", len(set(slugs)))
          print("DUPLICATE_EXAMPLES", [(p.get("nickname"),p.get("masterPlayerId"),p.get("playerSlug")) for p in players if p.get("masterPlayerId") in {x[0] for x in dup_ids}][:20])
          print("FIRST_PLAYER", players[0].get("nickname"), players[0].get("masterPlayerId"))
          print("LAST_PLAYER", players[-1].get("nickname"), players[-1].get("masterPlayerId"))
          if len(players) != 596 or len(set(slugs)) != 596:
              raise SystemExit("ERROR: player count or slugs are not unique")
          def pct(p):
              old = p.get("marketValue", 0) - p.get("subida", 0)
              return (p.get("subida", 0) / old * 100) if old > 0 else 0
          top = sorted((p for p in players if (p.get("subida") or 0) > 0),
                       key=lambda p: p["subida"], reverse=True)[:30]
          print("TOP30_COUNT", len(top))
          for i, p in enumerate(top, 1):
              print(f"{i:02d}. {p.get('nickname')} | +{p.get('subida')} EUR | {pct(p):.2f}% | id={p.get('masterPlayerId')}")
          print("VALIDATION_OK")
          PY
