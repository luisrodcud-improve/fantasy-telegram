name: Inspect Analitica Fantasy market
on:
  push:
    paths:
      - ".github/workflows/inspect-market.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test public reader access to market
        run: |
          python - <<'PY'
          import requests
          from urllib.parse import quote

          target = "https://www.analiticafantasy.com/fantasy-la-liga/mercado"
          urls = [
              "https://r.jina.ai/http://" + target.removeprefix("https://"),
              "https://r.jina.ai/http://" + target.removeprefix("https://") + "?page=2",
              "https://r.jina.ai/http://" + target.removeprefix("https://") + "?page=2&limit=10",
              "https://r.jina.ai/http://" + target.removeprefix("https://") + "?pagina=2",
              "https://r.jina.ai/http://" + target.removeprefix("https://") + "?pageIndex=1",
          ]
          headers = {"User-Agent": "Mozilla/5.0", "Accept": "text/plain"}
          for url in urls:
              try:
                  response = requests.get(url, headers=headers, timeout=45)
                  body = response.text
                  print("\\nURL", url)
                  print("STATUS", response.status_code, "BYTES", len(body))
                  print("START", body[:700].replace("\\n", " ") )
                  for term in ("596 jugadores", "Página", "Última actualización", "403 Forbidden", "Pedri"):
                      pos = body.lower().find(term.lower())
                      print("TERM", term, pos)
              except Exception as exc:
                  print("REQUEST_ERROR", url, repr(exc))
          PY
