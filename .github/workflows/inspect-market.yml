name: Inspect Analitica Fantasy market
on:
  push:
    paths:
      - ".github/workflows/inspect-market.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect rendered HTML and pagination controls
        run: |
          python - <<'PY'
          import requests, re
          target = "http://www.analiticafantasy.com/fantasy-la-liga/mercado"
          urls = [
              ("reader_html", "https://r.jina.ai/" + target),
              ("reader_encoded_page2", "https://r.jina.ai/" + target + "%3Fpage%3D2"),
          ]
          for label, url in urls:
              try:
                  r = requests.get(url, headers={
                      "User-Agent": "Mozilla/5.0",
                      "X-Return-Format": "html",
                      "X-With-Generated-Alt": "false",
                  }, timeout=60)
                  body = r.text
                  print("\\n==", label, "status", r.status_code, "bytes", len(body), "final", r.url, "==")
                  print("CONTENT_TYPE", r.headers.get("content-type"))
                  patterns = [
                      '<script[^>]+src="([^"]+)',
                      '<link[^>]+href="([^"]+)',
                      '.{0,100}(?:Página 1 de 60|Siguiente|pagination|pageIndex|pageSize|596 jugadores).{0,180}',
                      '.{0,100}(?:__NEXT_DATA__|__NUXT__|__INITIAL_STATE__|__APOLLO_STATE__).{0,180}',
                  ]
                  for pat in patterns:
                      matches = re.findall(pat, body, re.I|re.S)
                      print("PATTERN", pat, "COUNT", len(matches))
                      for m in matches[:35]:
                          print("MATCH", re.sub(r"\\s+", " ", str(m))[:450])
              except Exception as e:
                  print("ERROR", label, repr(e))
          PY
